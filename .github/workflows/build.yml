
name: Build ClipVault APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build ClipVault Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Latest Source
        run: |
          unzip -q "ClipVault-source.zip" -d source

      - name: Verify Android Project
        run: |
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          test -f source/app/src/main/java/com/clipvault/ClipKeyboardService.kt

      - name: Build Debug APK
        run: |
          cd source
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-Latest-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
